<!DOCTYPE html>
<html>
    <head>
        <title>Product_Manager_app</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--عرض الموقع بحجم المتصفح تلقائي ايا كان الجهاز-->
    </head>
    <body>

<div class="app">
    <h2 class="nour1911">@Eng_Nour El-din</h2>
    <h1>Product Manager</h1>

    <p class="subtitle">Manage your products using JavaScript and Local Storage</p>

    <div class="form-box">

        <input type="text" id="productName" placeholder="Product name">
        <input type="number" id="productPrice" placeholder="Product price">
        <input type="text" id="productQuantity" placeholder="Product quantity">

        <button id="saveBtn">Save Product</button>

        <p id="message"></p>
    </div>

    <div class="list-box">
        <h2>Products</h2>

        <div id="productList"></div>
    </div>
</div>


<script src="script.js"></script>
</body>
</html>
